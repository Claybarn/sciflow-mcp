# Running-onset-triggered widefield response, with the imaging clock aligned to the wheel clock.
# Replace the input ids with those returned by `import_data` (or run examples/run_demo.py).
name: running-onset-widefield
description: Align imaging to the reference clock, detect running bouts, average dF/F around bout onsets.
inputs:
  wheel: REPLACE
  widefield: REPLACE
  sync_ref: REPLACE
  sync_img: REPLACE
steps:
  - id: aligned
    op: align_clock
    inputs: {target: inputs.widefield, local_clock: inputs.sync_img, reference_clock: inputs.sync_ref}
  - id: running
    op: threshold_intervals
    inputs: {series: inputs.wheel}
    params: {threshold: 2.0}
  - id: bouts
    op: merge_intervals
    inputs: {a: steps.running}
    params: {max_gap: 0.5}
  - id: long_bouts
    op: filter_intervals
    inputs: {a: steps.bouts}
    params: {min_duration: 2.0}
  - id: epochs
    op: peri_event_normalize
    inputs: {series: steps.aligned, events: steps.long_bouts}
    params: {pre: 2.0, post: 4.0, baseline_start: -2.0, baseline_stop: 0.0, method: dff}
  - id: response
    op: epoch_average
    inputs: {epochs: steps.epochs}
outputs: [response]
