[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sciflow-mcp"
version = "0.1.0"
description = "MCP server for building reproducible, interoperable scientific workflows on stamped data (time, depth, frequency, ...)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Clayton Barnes", email = "barnes.clayton@icloud.com" }]
keywords = ["mcp", "reproducibility", "neuroscience", "time series", "workflows", "permutation test"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pyyaml>=6",
    "eventlogic>=0.2",
    "mcp>=2.3",
    # Claybarn/permute fork (imported as `permute`): multi-test stratified permutation tests.
    "permute-multitest>=0.3.0",
    "statsmodels>=0.15",
]

[project.urls]
Homepage = "https://github.com/Claybarn/sciflow-mcp"
Repository = "https://github.com/Claybarn/sciflow-mcp"
Issues = "https://github.com/Claybarn/sciflow-mcp/issues"

[project.scripts]
sciflow = "sciflow.cli:main"
sciflow-mcp = "sciflow.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/sciflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# To develop against a local EventLogic checkout, uncomment:
# [tool.uv.sources]
# eventlogic = { path = "../EventLogic", editable = true }
